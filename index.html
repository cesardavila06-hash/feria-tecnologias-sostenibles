<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Feria virtual en 3D: catálogo de casos de éxito de tecnologías industriales sostenibles por pabellones (Alemania, España, Italia).">
<meta property="og:title" content="Feria de Tecnologías Sostenibles">
<meta property="og:description" content="Recorre los pabellones y conoce cómo cada empresa resolvió problemas reales en la industria.">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>Feria de Tecnologías Sostenibles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escenario 3D (camino → pabellones → cajas) arriba; debajo, la misma información en tarjetas 2D; ficha de caso a pantalla completa en #de-N */
:root{
  --bg:#0a2540;        /* azul medio-bajo */
  --bg-deep:#071a2e;
  --surface:#103154;
  --surface-2:#163d63;
  --line:#245179;
  --fg:#ecf6f8;
  --muted:#9db8c8;
  --emerald:#1fc28c;   /* verde esmeralda */
  --emerald-2:#0f9a6e;
  --emerald-ink:#022319;
  --emerald-soft:rgba(31,194,140,.14);
  --paper:#ffffff;
  --navy-ink:#0a2540;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:radial-gradient(900px 520px at 85% -10%, rgba(31,194,140,.20), transparent 60%),radial-gradient(700px 500px at -10% 30%, rgba(31,120,194,.18), transparent 60%);
  background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--emerald);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding-block:22px 48px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.muted{color:var(--muted)}

/* Cabecera */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--emerald),#2a8fd6,var(--emerald));display:grid;place-items:center}
.brand-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px rgba(255,255,255,.0)}
.crumbs{font-family:var(--display);font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--muted)} .crumbs a:hover{color:var(--fg)}
.hero{display:flex;flex-direction:column;gap:10px;max-width:780px}
.hero h1{font-stretch:82%;font-weight:900;font-size:clamp(34px,6.4vw,62px);line-height:.98;letter-spacing:-.015em}
.hero h1 em{font-style:normal;color:var(--emerald)}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:62ch}

/* Escenario 3D */
.stage{position:relative;height:clamp(420px,66vh,640px);border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#0d3156,#0a2540);box-shadow:0 30px 80px -40px rgba(0,0,0,.7)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hud > *{pointer-events:auto}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:13px;background:rgba(7,26,46,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;color:var(--fg);text-decoration:none;cursor:pointer}
button.pill{font:inherit;font-family:var(--display);font-weight:700;font-size:13px}
.pill:hover{border-color:var(--emerald)}
.hud-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.hint{font-family:var(--display);font-size:12.5px;color:#cfe3ea;background:rgba(7,26,46,.6);border-radius:999px;padding:6px 12px}
.gates{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gate-btn{display:flex;align-items:center;gap:10px;background:rgba(7,26,46,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 14px 9px 10px;
  color:var(--fg);cursor:pointer;font-family:var(--display);text-align:left}
.gate-btn:hover{border-color:var(--emerald);transform:translateY(-1px)}
.gate-btn b{display:block;font-size:14.5px}
.gate-btn small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--body)}
.flag{width:34px;height:23px;border-radius:4px;overflow:hidden;display:flex;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.flag.v{flex-direction:row} .flag.h{flex-direction:column}
.flag i{display:block}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-120%);background:var(--paper);color:var(--navy-ink);font-family:var(--display);font-weight:800;font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tip small{display:block;font-weight:600;font-size:11px;color:#3b6178}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--emerald);color:var(--emerald-ink);font-family:var(--display);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:10px;max-width:90%;text-align:center}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--muted);font-size:14px}

/* Resumen */
.summary{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.summary div{display:flex;align-items:baseline;gap:8px}
.summary b{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:30px;color:var(--emerald);font-variant-numeric:tabular-nums}
.summary span{color:var(--muted);font-size:14.5px}

/* Pabellones (2D) */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,3.6vw,30px);font-stretch:88%;font-weight:800}
.pavs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pav{position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;overflow:hidden;transition:transform .2s,border-color .2s}
.pav:hover{transform:translateY(-3px);border-color:var(--emerald)}
.pav .flag{width:56px;height:38px;border-radius:6px}
.pav h3{font-size:24px;font-stretch:88%;font-weight:800}
.pav .st{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pav .go{font-family:var(--display);font-weight:700;font-size:14px;color:var(--emerald)}
.pav.soon .go{color:var(--muted)}

/* Catálogo de empresas (2D) */
.tools{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;max-width:460px}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;padding:11px 0;outline:none}
.search:focus-within{border-color:var(--emerald)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{font-family:var(--display);font-weight:600;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:var(--emerald);box-shadow:0 18px 40px -24px rgba(31,194,140,.6)}
.logo-box{background:var(--paper);height:118px;display:grid;place-items:center;padding:18px 22px;position:relative}
.logo-box img{max-height:76px;max-width:100%;object-fit:contain}
.logo-box .word{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:24px;color:var(--navy-ink);text-align:center;line-height:1.05;letter-spacing:-.01em}
.logo-box .num{position:absolute;top:10px;left:10px;font-family:var(--display);font-weight:800;font-size:12px;color:#fff;background:var(--navy-ink);border-radius:7px;padding:3px 8px}
.card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h3{font-size:19px;font-weight:800;font-stretch:92%}
.card-body p{margin:0;font-size:14.5px;color:#c7dbe4;line-height:1.45}
.kpi{margin-top:auto;padding-top:10px;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line)}
.kpi b{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:24px;color:var(--emerald);white-space:nowrap}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.3}
.card.empty{border-style:dashed;background:transparent}
.card.empty .logo-box{background:rgba(255,255,255,.04);border-bottom:1px dashed var(--line)}
.card.empty .logo-box .word{color:var(--muted);font-size:16px;font-weight:700;letter-spacing:.12em}
.empty-msg{color:var(--muted);text-align:center;padding:24px}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,#f2c230 0 12px,#14243a 12px 24px)}
.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.build{border:1px dashed var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
.build .in{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.build b{font-family:var(--display);font-weight:800;font-size:15px}
.build span{font-size:12.5px;color:var(--muted)}
.camara{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.camara .chip-logo{background:var(--paper);border-radius:12px;padding:8px 14px;height:56px;display:grid;place-items:center}
.camara .chip-logo img{max-height:40px;max-width:240px;object-fit:contain}
.camara small{color:var(--muted);font-size:13px}
/* Cinta de logos */
.ribbon{margin-top:8px;display:flex;flex-direction:column;gap:12px}
.ribbon .lab{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.marquee{position:relative;overflow:hidden;border-radius:18px;background:var(--paper);padding-block:14px}
.mwrap{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:44px;width:max-content;align-items:center;animation:slide 48s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track figure{margin:0;height:56px;display:grid;place-items:center;flex:none}
.track img{max-height:52px;max-width:200px;object-fit:contain;display:block}
.track .txt{font-family:var(--display);font-weight:900;font-size:20px;color:var(--navy-ink);white-space:nowrap}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.track{animation:none;flex-wrap:wrap;width:auto;justify-content:center;padding-inline:16px}.track .dup{display:none}}

/* Ficha de caso */
.back{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--fg)}
.d-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:820px){.d-hero{grid-template-columns:1fr}}
.d-id{display:flex;flex-direction:column;gap:14px;justify-content:center}
.d-id .logo-box{border-radius:16px;height:110px;max-width:320px}
.d-id h1{font-stretch:82%;font-weight:900;font-size:clamp(34px,5.6vw,54px);line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--display);font-size:12.5px;font-weight:600;border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.tag.ind{background:var(--emerald-soft);border-color:transparent;color:var(--emerald)}
.media{border-radius:20px;overflow:hidden;min-height:280px;position:relative;background:var(--paper);display:grid;place-items:center;cursor:zoom-in;border:0;padding:0}
.media img{width:100%;height:100%;max-height:440px;object-fit:contain;padding:16px}
.media figcaption{position:absolute;left:12px;bottom:12px;background:rgba(7,26,46,.82);color:#fff;font-size:12.5px;padding:5px 10px;border-radius:8px;font-family:var(--display)}
.media.big{cursor:default;background:linear-gradient(135deg,#0f9a6e 0%,#12507f 70%,#0a2540 100%);place-items:end start;padding:26px;text-align:left}
.media.big .v{font-family:var(--display);font-stretch:80%;font-weight:900;font-size:clamp(52px,9vw,88px);line-height:.9;color:#fff}
.media.big .l{color:#d8f3ea;font-size:16px;max-width:30ch;margin-top:8px}
.case-head{display:flex;flex-direction:column;gap:6px}
.case-head h2{font-size:clamp(22px,3.4vw,30px);font-stretch:90%;font-weight:800;max-width:30ch}
.where{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0;counter-reset:s}
@media (max-width:900px){.flow{grid-template-columns:1fr}}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.flow li .k{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.flow li .k::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--emerald);color:var(--emerald-ink);font-size:13px;letter-spacing:0}
.flow li p{margin:0;color:#d3e4eb;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.stat .v{font-family:var(--display);font-stretch:82%;font-weight:900;font-size:22px;line-height:1.05;color:var(--emerald);overflow-wrap:anywhere}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.stat.wide{grid-column:1/-1}
.circ{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:linear-gradient(90deg,var(--emerald-soft),transparent);border-radius:16px;padding:16px 18px}
.circ svg{width:40px;height:40px}
.circ .k{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--emerald)}
.circ p{margin:2px 0 0}
.note{font-size:14.5px;color:#cfe0e7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.g-item{aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:var(--paper);display:grid;place-items:center;border:0;padding:0;cursor:zoom-in}
.g-item img{width:100%;height:100%;object-fit:contain;padding:10px}
.g-empty{aspect-ratio:4/3;max-width:100%;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--display);font-size:13px;padding:12px}
.d-foot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.d-foot{grid-template-columns:1fr}}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.contact .who{font-family:var(--display);font-weight:800;font-size:18px}
.crow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px}
.crow .lab{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.crow .val{min-width:0;overflow-wrap:anywhere;user-select:all}
.copy{font-family:var(--display);font-weight:700;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:5px 9px;cursor:pointer}
.copy.ok{border-color:var(--emerald);color:var(--emerald)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;border-radius:18px;padding:20px;background:var(--emerald);color:var(--emerald-ink)}
.cta b{font-family:var(--display);font-size:19px;font-weight:800;display:block}
.cta small{font-size:13.5px}
.cta .arr{font-family:var(--display);font-size:28px;font-weight:800}
.cta:hover{filter:brightness(1.06)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pager a:hover{color:var(--fg);border-color:var(--emerald)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(4,14,26,.9);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:82vh;background:#fff;border-radius:12px;padding:12px}
.lb p{color:#fff;font-family:var(--display);margin:12px 0 0;text-align:center}
.foot{color:var(--muted);font-size:13.5px;text-align:center;margin:0}
@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .45s ease both} @keyframes fade{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <a class="brand" href="#inicio" style="text-decoration:none"><span class="brand-mark" aria-hidden="true"></span>Feria virtual · Tecnologías sostenibles</a>
    <nav class="crumbs" id="crumbs" aria-label="Ubicación"></nav>
  </div>

  <main id="home">
    <div class="wrap" style="padding:0;max-width:none">
      <header class="hero fade" id="hero"></header>

      <section class="stage" id="stage" aria-label="Recorrido 3D">
        <div class="loading" id="loading">Cargando el recorrido…</div>
        <div class="hud">
          <div class="hud-top" id="hudTop"></div>
          <div class="hud-bottom" id="hudBottom"></div>
        </div>
        <div class="tip" id="tip" hidden></div>
        <div class="toast" id="toast" hidden></div>
      </section>

      <div class="summary" id="summary"></div>
      <section id="below" style="display:flex;flex-direction:column;gap:16px"></section>
      <p class="foot">Catálogo de casos de éxito: cómo cada empresa aplica su tecnología para resolver problemas en distintas industrias.</p>
    </div>
  </main>

  <main id="detail" hidden></main>
  <section class="ribbon" id="ribbon" aria-label="Aliados"></section>
</div>
<div class="lb" id="lb" hidden><div><img id="lbImg" alt=""><p id="lbCap"></p></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = { data:null, view:'plaza', pav:null, q:'', ind:'todas', imgs:{}, homeScroll:0 };

/* ---------- utilidades ---------- */
function flagHTML(p, cls=''){
  const dir = p.bandera_dir || 'h', w = p.bandera_pesos || [1,1,1];
  return `<span class="flag ${dir} ${cls}" aria-hidden="true">${p.bandera.map((c,i)=>`<i style="background:${c};flex:${w[i]}"></i>`).join('')}</span>`;
}
const occupied = p => p.stands.filter(s => s.estado === 'ocupado');
const bySlug = slug => S.data.pabellones.find(p => p.slug === slug);
const byId = id => S.data.pabellones.find(p => p.id === id);
function logoHTML(s){
  if (s.logo) return `<img src="${esc(s.logo)}" alt="Logo de ${esc(s.empresa)}">`;
  return `<span class="word">${esc(s.empresa)}</span>`;
}
function loadImg(src){ return new Promise(res => { if(!src) return res(null); if(S.imgs[src]) return res(S.imgs[src]);
  const im = new Image(); im.onload = () => { S.imgs[src] = im; res(im); }; im.onerror = () => res(null); im.src = src; }); }

/* ---------- motor 3D ---------- */
const G = (() => {
  let R, scene, cam, ctl, world, clock, pick = [], flags = [], hover = null, fly = null, mode = null, ok = false, tips = [];
  const stage = $('#stage');
  const disposables = [];
  const track = o => (disposables.push(o), o);

  function init(){
    try {
      if (!window.THREE || !THREE.OrbitControls) throw new Error('three');
      R = new THREE.WebGLRenderer({ antialias:true });
    } catch(e) {
      $('#loading').outerHTML = `<div class="nogl">El recorrido 3D no está disponible en este dispositivo.<br>Puedes navegar los pabellones y empresas desde las tarjetas de abajo.</div>`;
      return false;
    }
    R.setPixelRatio(Math.min(devicePixelRatio, 2));
    R.outputEncoding = THREE.sRGBEncoding;
    R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.prepend(R.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b2a4a);
    scene.fog = new THREE.Fog(0x0b2a4a, 38, 90);
    cam = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
    ctl = new THREE.OrbitControls(cam, R.domElement);
    ctl.enableDamping = true; ctl.dampingFactor = .08; ctl.maxPolarAngle = Math.PI * .46; ctl.minDistance = 4; ctl.maxDistance = 95;
    scene.add(new THREE.HemisphereLight(0xd9f1ff, 0x0d4a3d, .8));
    const sun = new THREE.DirectionalLight(0xffffff, .9);
    sun.position.set(14, 26, 12); sun.castShadow = true; sun.shadow.mapSize.set(1536, 1536);
    Object.assign(sun.shadow.camera, { left:-32, right:32, top:32, bottom:-32, near:1, far:80 });
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x3b6f9a, .25));
    clock = new THREE.Clock();
    new ResizeObserver(resize).observe(stage); resize();
    let down = null;
    R.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
    R.domElement.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX-down[0], e.clientY-down[1]) < 7) click(e); down = null; });
    R.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') hoverAt(e); });
    R.domElement.addEventListener('pointerleave', () => setHover(null));
    $('#loading').remove();
    ok = true; loop();
    return true;
  }
  function resize(){ if (!R) return; const w = stage.clientWidth, h = stage.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }

  /* texturas */
  function tex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = R.capabilities.getMaxAnisotropy(); return track(t); }
  function fitText(g, text, maxW, size, weight, font='Archivo'){ let s = size; do { g.font = `${weight} ${s}px ${font}, Arial, sans-serif`; s -= 2; } while (g.measureText(text).width > maxW && s > 10); return s + 2; }
  function wrap(g, text, maxW){ const words = String(text).split(' '); const lines = []; let line = '';
    for (const w of words){ const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; } if (line) lines.push(line); return lines; }
  function drawFlag(g, p, x, y, w, h){ const ws = p.bandera_pesos || [1,1,1], sum = ws.reduce((a,b)=>a+b,0); let o = 0;
    p.bandera.forEach((c,i) => { g.fillStyle = c; const f = ws[i]/sum;
      if ((p.bandera_dir||'h') === 'h') g.fillRect(x, y + o*h, w, f*h + 1); else g.fillRect(x + o*w, y, f*w + 1, h); o += f; }); }
  function logoFace(s, p){ return tex(512, 512, (g, W, H) => {
    if (s.estado !== 'ocupado'){ g.fillStyle = '#10304f'; g.fillRect(0,0,W,H);
      const band = (y) => { g.save(); g.beginPath(); g.rect(0,y,W,70); g.clip(); g.fillStyle = '#f2c230'; g.fillRect(0,y,W,70); g.fillStyle = '#14243a';
        for (let x = -80; x < W + 80; x += 56) { g.beginPath(); g.moveTo(x,y); g.lineTo(x+28,y); g.lineTo(x-42,y+70); g.lineTo(x-70,y+70); g.closePath(); g.fill(); } g.restore(); };
      band(0); band(H-70);
      g.fillStyle = '#f2c230'; g.textAlign = 'center'; g.font = '900 54px Archivo, Arial'; g.fillText('EN', W/2, H/2 - 34); g.fillText('CONSTRUCCIÓN', W/2, H/2 + 24);
      g.fillStyle = '#cfe0ea'; g.font = '600 28px Figtree, Arial'; g.fillText(`Stand ${s.n} · Próximamente`, W/2, H/2 + 82); return; }
    g.fillStyle = '#ffffff'; g.fillRect(0,0,W,H);
    const im = S.imgs[s.logo];
    if (im){ const bw = W*.82, bh = H*.5, r = Math.min(bw/im.width, bh/im.height); const w = im.width*r, h = im.height*r; g.drawImage(im, (W-w)/2, (H*.78-h)/2 + 10, w, h); }
    else { g.fillStyle = '#0a2540'; g.textAlign = 'center'; g.font = '900 64px Archivo, Arial'; const lines = wrap(g, s.empresa, W*.82);
      const sz = lines.length > 2 ? 48 : 64; g.font = `900 ${sz}px Archivo, Arial`; const L = wrap(g, s.empresa, W*.82);
      L.forEach((l,i) => g.fillText(l, W/2, H*.39 + (i - (L.length-1)/2) * sz*1.05 + sz*.35)); }
    g.fillStyle = '#0a2540'; g.fillRect(0, H*.8, W, H*.2);
    g.fillStyle = '#1fc28c'; g.fillRect(0, H*.8, W, 8);
    g.fillStyle = '#ffffff'; g.textAlign = 'left'; g.font = '800 30px Archivo, Arial'; g.fillText(`STAND ${s.n}`, 26, H*.9 + 12);
    g.textAlign = 'right'; g.fillStyle = '#9fe8cd'; fitText(g, s.industria.toUpperCase(), W*.58, 24, 700); g.fillText(s.industria.toUpperCase(), W - 26, H*.9 + 10);
  }); }
  function topFace(s){ return tex(256, 256, (g, W, H) => { g.fillStyle = s.estado === 'ocupado' ? '#1fc28c' : '#f2c230'; g.fillRect(0,0,W,H);
    g.fillStyle = s.estado === 'ocupado' ? '#022319' : '#14243a'; g.textAlign = 'center'; g.font = '900 130px Archivo, Arial'; g.fillText(s.n, W/2, H/2 + 46); }); }
  function signTex(p){ return tex(1024, 256, (g, W, H) => { g.fillStyle = '#0a2540'; g.fillRect(0,0,W,H); drawFlag(g, p, 28, 48, 210, 160);
    g.fillStyle = '#9fe8cd'; g.font = '700 34px Archivo, Arial'; g.fillText('PABELLÓN', 272, 104);
    g.fillStyle = '#ffffff'; fitText(g, p.nombre.toUpperCase(), W - 300, 100, 900); g.fillText(p.nombre.toUpperCase(), 268, 196); }); }
  function flagTex(p){ return tex(300, 200, (g, W, H) => drawFlag(g, p, 0, 0, W, H)); }
  function badgeSprite(text, sub){ const t = tex(512, 160, (g, W, H) => { g.fillStyle = 'rgba(7,26,46,.86)'; roundRect(g, 4, 4, W-8, H-8, 40); g.fill();
      g.strokeStyle = '#1fc28c'; g.lineWidth = 4; g.stroke(); g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.font = '800 48px Archivo, Arial'; g.fillText(text, W/2, sub ? 72 : 96);
      if (sub){ g.fillStyle = '#9fe8cd'; g.font = '600 32px Figtree, Arial'; g.fillText(sub, W/2, 122); } });
    const sp = new THREE.Sprite(track(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false }))); sp.scale.set(6.4, 2, 1); return sp; }
  function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
  const lin = c => new THREE.Color(c).convertSRGBToLinear();
  const M = (c, o={}) => { if (o.emissive !== undefined) o.emissive = lin(o.emissive); return track(new THREE.MeshStandardMaterial(Object.assign({ roughness:.85, metalness:.05 }, o, { color:lin(c) }))); };
  function box(w, h, d, mat){ const m = new THREE.Mesh(track(new THREE.BoxGeometry(w, h, d)), mat); m.castShadow = true; m.receiveShadow = true; return m; }
  function seg(a, b, w, mat, y=.03){ const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz); const m = box(w, .06, L, mat); m.castShadow = false;
    m.position.set((a.x+b.x)/2, y, (a.z+b.z)/2); m.rotation.y = Math.atan2(dx, dz); return m; }

  function clear(){ if (world) scene.remove(world); disposables.splice(0).forEach(d => d.dispose && d.dispose()); pick = []; flags = []; hover = null; tips = []; world = new THREE.Group(); scene.add(world); }

  /* ---------- PLAZA: camino que lleva a 3 pabellones ---------- */
  function buildPlaza(){
    clear(); mode = 'plaza';
    const ground = new THREE.Mesh(track(new THREE.PlaneGeometry(220, 220)), M(0x0d3550)); ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; world.add(ground);
    const lawn = M(0x0f4f45);
    [[-18,14,16],[18,14,16],[-26,-6,12],[26,-6,12]].forEach(([x,z,r]) => { const d = new THREE.Mesh(track(new THREE.CircleGeometry(r, 48)), lawn); d.rotation.x = -Math.PI/2; d.position.set(x,.01,z); d.receiveShadow = true; world.add(d); });
    const stone = M(0xc9ddd8, { roughness:.95 }), edge = M(0x1fc28c, { emissive:0x0b5a40, emissiveIntensity:.6 });
    const J = new THREE.Vector3(0,0,4);
    world.add(seg(new THREE.Vector3(0,0,40), J, 3.4, stone));
    world.add(seg(new THREE.Vector3(1.8,0,40), new THREE.Vector3(1.8,0,6.5), .12, edge, .07));
    world.add(seg(new THREE.Vector3(-1.8,0,40), new THREE.Vector3(-1.8,0,6.5), .12, edge, .07));
    const plaza = new THREE.Mesh(track(new THREE.CylinderGeometry(5.2, 5.2, .08, 64)), stone); plaza.position.copy(J); plaza.position.y = .04; plaza.receiveShadow = true; world.add(plaza);
    const ring = new THREE.Mesh(track(new THREE.TorusGeometry(5.2, .08, 8, 96)), edge); ring.rotation.x = Math.PI/2; ring.position.set(J.x, .1, J.z); world.add(ring);
    // escultura circular
    const sc = new THREE.Mesh(track(new THREE.TorusGeometry(1.2, .28, 20, 64, Math.PI * 1.7)), M(0x1fc28c, { metalness:.4, roughness:.35, emissive:0x0a4a35, emissiveIntensity:.5 }));
    sc.position.set(J.x, 2.2, J.z); sc.castShadow = true; sc.userData.spin = true; world.add(sc);
    const ped = box(1.4, 1, 1.4, M(0x0a2540)); ped.position.set(J.x, .5, J.z); world.add(ped);

    const P = S.data.pabellones;
    const spots = [new THREE.Vector3(-17,0,-11), new THREE.Vector3(0,0,-19), new THREE.Vector3(17,0,-11)];
    P.slice(0,3).forEach((p, i) => {
      const pos = spots[i]; const dir = J.clone().sub(pos).setY(0).normalize(); const front = pos.clone().add(dir.clone().multiplyScalar(4.4));
      world.add(seg(J.clone().add(dir.clone().multiplyScalar(-4.8)), front, 3.2, stone));
      const b = building(p); b.position.copy(pos); b.rotation.y = Math.atan2(dir.x, dir.z); world.add(b);
      b.userData.front = front; b.userData.dir = dir;
      const n = occupied(p).length;
      const badge = badgeSprite(`Pabellón ${p.nombre}`, n ? `${n} empresas · entrar` : 'En construcción'); badge.position.set(pos.x, 9.4, pos.z); world.add(badge);
    });
    // árboles y faroles a lo largo del camino
    for (let z = 9; z <= 22; z += 6.5) [-4.2, 4.2].forEach((x, k) => { const t = tree(); t.position.set(x + (k ? .4 : -.4), 0, z); world.add(t); const l = lamp(); l.position.set(x * .62, 0, z + 3.2); world.add(l); });
    [[-9,-2],[9,-2],[-24,-16],[24,-16],[-8,-27],[8,-27],[-28,2],[28,2],[-12,12],[12,12]].forEach(([x,z]) => { const t = tree(1.3); t.position.set(x,0,z); world.add(t); });
  }
  function building(p){
    const g = new THREE.Group(), n = occupied(p).length;
    const wall = M(0xeaf2f6), dark = M(0x081d33), green = M(0x18b07f, { roughness:.6 });
    const body = box(10, 4.6, 7, wall); body.position.y = 2.3; g.add(body);
    const roof = box(10.8, .45, 7.8, green); roof.position.y = 4.8; g.add(roof);
    const door = new THREE.Mesh(track(new THREE.PlaneGeometry(3.6, 3.2)), M(n ? 0x0f2d4d : 0x14324f, { emissive: n ? 0x0a5a42 : 0x000000, emissiveIntensity:.5 })); door.position.set(0, 1.6, 3.51); g.add(door);
    const sign = box(7.4, 1.4, .3, [wall, wall, wall, wall, track(new THREE.MeshStandardMaterial({ map:signTex(p), roughness:.6 })), wall]); sign.position.set(0, 3.95, 3.6); g.add(sign);
    // franjas de bandera a los lados de la fachada
    [-4.2, 4.2].forEach(x => { const f = new THREE.Mesh(track(new THREE.PlaneGeometry(.9, 3.4)), track(new THREE.MeshStandardMaterial({ map:flagTex(Object.assign({}, p, { bandera_dir: p.bandera_dir === 'h' ? 'h' : 'v' })) }))); f.position.set(x, 2.1, 3.52); g.add(f); });
    // mástil con bandera ondeando
    const pole = new THREE.Mesh(track(new THREE.CylinderGeometry(.07, .07, 8, 12)), M(0xdfe8ee, { metalness:.6, roughness:.3 })); pole.position.set(5.8, 4, 4.4); pole.castShadow = true; g.add(pole);
    const fg = track(new THREE.PlaneGeometry(2.7, 1.8, 24, 8)); fg.translate(1.35, 0, 0);
    const fl = new THREE.Mesh(fg, track(new THREE.MeshStandardMaterial({ map:flagTex(p), side:THREE.DoubleSide, roughness:.7 }))); fl.position.set(5.85, 7, 4.4); fl.castShadow = true; g.add(fl);
    fl.userData.base = fg.attributes.position.array.slice(); flags.push(fl);
    if (p.camara && S.imgs[p.camara.logo]) {
      const im = S.imgs[p.camara.logo];
      const t = tex(1024, 280, (c, W, H) => { c.fillStyle = '#ffffff'; c.fillRect(0,0,W,H); const r = Math.min((W*.9)/im.width, (H*.8)/im.height); const w = im.width*r, h = im.height*r; c.drawImage(im, (W-w)/2, (H-h)/2, w, h); });
      const lm = track(new THREE.MeshStandardMaterial({ map:t, roughness:.6 })), wm = M(0xffffff), fr = M(0x0a2540);
      // valla sobre el techo con el logo de la cámara
      [-2.6, 2.6].forEach(x => { const leg = box(.16, 1.1, .16, fr); leg.position.set(x, 5.55, 1.6); g.add(leg); });
      const frame = box(7.4, 2.2, .18, fr); frame.position.set(0, 7.1, 1.6); g.add(frame);
      const board = box(7.1, 1.94, .1, [wm, wm, wm, wm, lm, wm]); board.position.set(0, 7.1, 1.66); g.add(board);
    }
    g.traverse(o => { if (o.isMesh) { o.userData.pick = { type:'pav', slug:p.slug, name:`Pabellón ${p.nombre}`, sub: n ? `${n} empresas` : 'En construcción' }; pick.push(o); } });
    g.userData.slug = p.slug;
    return g;
  }
  function tree(s=1){ const g = new THREE.Group(); const tr = new THREE.Mesh(track(new THREE.CylinderGeometry(.12*s, .16*s, 1*s, 8)), M(0x5b4636)); tr.position.y = .5*s; tr.castShadow = true; g.add(tr);
    const c = new THREE.Mesh(track(new THREE.ConeGeometry(.95*s, 2.4*s, 10)), M(0x13a374, { roughness:.7 })); c.position.y = 2.1*s; c.castShadow = true; g.add(c);
    const c2 = new THREE.Mesh(track(new THREE.ConeGeometry(.7*s, 1.7*s, 10)), M(0x1cc08a, { roughness:.7 })); c2.position.y = 3.0*s; c2.castShadow = true; g.add(c2); return g; }
  function lamp(){ const g = new THREE.Group(); const p = new THREE.Mesh(track(new THREE.CylinderGeometry(.05, .05, 2.6, 8)), M(0x0a2540)); p.position.y = 1.3; g.add(p);
    const b = new THREE.Mesh(track(new THREE.SphereGeometry(.2, 16, 12)), track(new THREE.MeshBasicMaterial({ color:0xbff7e3 }))); b.position.y = 2.7; g.add(b); return g; }

  /* ---------- PABELLÓN: empresas como cajas con logo ---------- */
  function buildPav(p){
    clear(); mode = 'pav';
    const floor = new THREE.Mesh(track(new THREE.PlaneGeometry(60, 60)), M(0x0f3557)); floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; world.add(floor);
    const grid = new THREE.GridHelper(36, 18, 0x1fc28c, 0x1fc28c); grid.material.transparent = true; grid.material.opacity = .1; grid.position.y = .01; track(grid.geometry); track(grid.material); world.add(grid);
    const carpet = box(4.2, .05, 26, M(0x0f8a64, { roughness:1 })); carpet.position.set(0, .03, 1.5); carpet.castShadow = false; world.add(carpet);
    const back = box(30, 7, .4, M(0x0b2a4a)); back.position.set(0, 3.5, -13); world.add(back);
    const banner = new THREE.Mesh(track(new THREE.PlaneGeometry(14, 3.5)), track(new THREE.MeshStandardMaterial({ map:signTex(p), roughness:.6 }))); banner.position.set(0, 4.2, -12.78); world.add(banner);
    [-15, 15].forEach(x => { const w = box(.4, 4, 28, M(0x0b2a4a)); w.position.set(x, 2, 0); world.add(w); });
    const fl = new THREE.Mesh(track(new THREE.PlaneGeometry(30, .35)), track(new THREE.MeshBasicMaterial({ map:flagTex(Object.assign({}, p, { bandera_dir:'v' })) }))); fl.position.set(0, 7.18, -12.78); world.add(fl);
    const stands = p.stands;
    const ROWS = [6.5, 1.5, -3.5, -8.5], COLS = [-4.6, 4.6, -10, 10];
    stands.forEach((s, i) => {
      const x = COLS[i % 4], z = ROWS[Math.floor(i / 4) % 4], left = x < 0;
      const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = left ? Math.PI/2 : -Math.PI/2;
      const plat = box(4, .22, 4, M(s.estado === 'ocupado' ? 0x14406a : 0x112f4f)); plat.position.y = .11; g.add(plat);
      const rim = new THREE.Mesh(track(new THREE.TorusGeometry(2.1, .05, 6, 4)), M(0x1fc28c, { emissive:0x0b5a40, emissiveIntensity:.7 })); rim.rotation.set(Math.PI/2, 0, Math.PI/4); rim.position.y = .24; g.add(rim);
      const side = track(new THREE.MeshStandardMaterial({ map:logoFace(s, p), roughness:.5 }));
      const top = track(new THREE.MeshStandardMaterial({ map:topFace(s), roughness:.5 }));
      const cube = box(2.5, 2.5, 2.5, [side, side, top, side, side, side]); cube.position.y = 1.5; g.add(cube);
      if (s.estado !== 'ocupado') { const e = new THREE.LineSegments(track(new THREE.EdgesGeometry(cube.geometry)), track(new THREE.LineBasicMaterial({ color:0xf2c230 }))); cube.add(e);
        const cone = new THREE.Mesh(track(new THREE.ConeGeometry(.28, .75, 16)), M(0xff7a1a, { roughness:.6 })); cone.position.set(1.45, .6, 1.45); cone.castShadow = true; g.add(cone);
        const ring = new THREE.Mesh(track(new THREE.CylinderGeometry(.17, .21, .14, 16)), M(0xffffff)); ring.position.set(1.45, .62, 1.45); g.add(ring); }
      cube.userData.base = 1.5; cube.userData.stand = s;
      cube.userData.pick = { type:'stand', id:`${p.id}-${s.n}`, n:s.n, empty: s.estado !== 'ocupado', name: s.estado === 'ocupado' ? s.empresa : `Stand ${s.n} · en construcción`, sub: s.estado === 'ocupado' ? s.industria : 'Próximamente' };
      pick.push(cube); world.add(g); g.userData.cube = cube;
    });
  }

  /* cámara */
  const views = { plaza:{ pos:[0, 10.5, 25], tgt:[0, 2, -9] }, pav:{ pos:[0, 14, 21], tgt:[0, .5, -2] } };
  function fit(v){ const a = cam.aspect, k = Math.min(3, Math.max(1, 1.75 / a)); return { pos: new THREE.Vector3(v.pos[0], v.pos[1]*k, v.pos[2]*k), tgt: new THREE.Vector3(...v.tgt) }; }
  function flyTo(pos, tgt, dur=1.2, done){ if (RM) { cam.position.copy(pos); ctl.target.copy(tgt); done && done(); return; }
    fly = { p0: cam.position.clone(), t0: ctl.target.clone(), p1: pos, t1: tgt, t:0, dur, done }; }
  function overview(){ const v = fit(views[mode]); flyTo(v.pos, v.tgt, 1); }
  function intro(){ const v = fit(views[mode]);
    if (mode === 'plaza') { cam.position.set(0, 2.4, 46); ctl.target.set(0, 2.2, 20); }
    else { cam.position.set(0, 2.6, 24); ctl.target.set(0, 2, 4); }
    flyTo(v.pos, v.tgt, mode === 'plaza' ? 2.6 : 1.6); }

  /* interacción */
  const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
  function hit(e){ const r = R.domElement.getBoundingClientRect(); mv.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mv, cam); const h = ray.intersectObjects(pick, false)[0]; return h ? h.object : null; }
  function setHover(o){ hover = o; R && (R.domElement.style.cursor = o ? 'pointer' : 'grab'); if (!o) $('#tip').hidden = true; }
  function hoverAt(e){ const o = hit(e); setHover(o); if (o) { const d = o.userData.pick, r = stage.getBoundingClientRect(); const t = $('#tip');
    t.innerHTML = `${esc(d.name)}<small>${esc(d.sub)}</small>`; t.style.left = (e.clientX - r.left) + 'px'; t.style.top = (e.clientY - r.top) + 'px'; t.hidden = false; } }
  function click(e){ const o = hit(e); if (!o) return; const d = o.userData.pick;
    if (d.type === 'pav') enterPav(d.slug);
    else if (d.empty) toast(`Stand ${d.n} en construcción: pronto estará aquí una empresa de ${S.pav.nombre}.`);
    else { const wp = new THREE.Vector3(); o.getWorldPosition(wp); const dir = new THREE.Vector3(-Math.sign(wp.x), 0, .35).normalize();
      flyTo(wp.clone().add(dir.multiplyScalar(5.5)).setY(3.2), wp.clone().setY(1.6), .75, () => { location.hash = d.id; }); }
  }
  function enterPav(slug){ if (!ok) { location.hash = slug; return; }
    const b = world.children.find(c => c.userData.slug === slug);
    if (mode === 'plaza' && b) { const f = b.userData.front, dir = b.userData.dir; flyTo(f.clone().add(dir.clone().multiplyScalar(3)).setY(2.2), f.clone().setY(1.8).sub(dir.clone().multiplyScalar(4)), 1.1, () => { location.hash = slug; }); }
    else location.hash = slug; }

  let visible = true;
  function loop(){ requestAnimationFrame(loop); if (!visible) return; const raw = clock.getDelta(), dt = Math.min(raw, .05), t = clock.elapsedTime;
    if (fly) { fly.t += Math.min(raw, .25) / fly.dur; const k = Math.min(fly.t, 1), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
      cam.position.lerpVectors(fly.p0, fly.p1, e); ctl.target.lerpVectors(fly.t0, fly.t1, e); if (k >= 1) { const d = fly.done; fly = null; d && d(); } }
    flags.forEach(f => { const a = f.geometry.attributes.position, b = f.userData.base; for (let i = 0; i < a.count; i++) { const x = b[i*3]; a.array[i*3+2] = Math.sin(x * 2.2 - t * 3.2) * .12 * (x / 2.7); } a.needsUpdate = true; });
    world && world.traverse(o => { if (o.userData.spin) o.rotation.y += dt * .5;
      if (o.userData.base !== undefined && o.userData.stand) { const target = o.userData.base + (o === hover ? .35 : 0) + Math.sin(t * 1.4 + o.userData.stand.n) * .05; o.position.y += (target - o.position.y) * .15; if (o === hover) o.rotation.y += dt * .6; } });
    ctl.update(); R.render(scene, cam); }

  return {
    init, overview, enterPav,
    show(m, p){ if (!ok) return; visible = true; if (m === 'plaza') buildPlaza(); else buildPav(p); setHover(null); resize(); intro(); },
    pause(){ visible = false; },
    resume(){ visible = true; resize(); },
    get mode(){ return mode; }, get ok(){ return ok; }
  };
})();

/* ---------- rutas ---------- */
function route(){
  const h = location.hash.replace('#','');
  const m = h.match(/^([a-z]{2})-(\d+)$/);
  if (m) {
    const p = byId(m[1]), s = p && p.stands.find(x => x.n === +m[2] && x.estado === 'ocupado');
    if (s) { if (S.view !== 'detail') S.homeScroll = scrollY; S.view = 'detail'; S.pav = p; S.stand = s;
      $('#home').hidden = true; $('#detail').hidden = false; G.pause(); renderDetail(); renderCrumbs(); scrollTo(0, 0);
      document.title = `${s.empresa} · Feria de Tecnologías Sostenibles`; return; }
  }
  const fromDetail = S.view === 'detail';
  const p = bySlug(h);
  const nv = p ? 'pav' : 'plaza';
  const changed = nv !== S.view || (p && p !== S.pav) || (fromDetail && G.mode !== (p ? 'pav' : 'plaza'));
  if (p && p !== S.pav) { S.q = ''; S.ind = 'todas'; }
  S.view = nv; S.pav = p || null;
  $('#detail').hidden = true; $('#home').hidden = false;
  renderCrumbs(); renderHero(); renderHud(); renderSummary(); renderBelow();
  if (changed || !fromDetail) G.show(nv, p); else G.resume();
  if (fromDetail) requestAnimationFrame(() => scrollTo(0, S.homeScroll)); else if (changed) scrollTo(0, 0);
  document.title = p ? `Pabellón ${p.nombre} · Feria de Tecnologías Sostenibles` : 'Feria de Tecnologías Sostenibles';
}

/* ---------- arranque ---------- */
fetch('data/catalogo.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(async d => {
  S.data = d;
  const srcs = [...d.pabellones.flatMap(p => p.stands.filter(s => s.logo).map(s => s.logo)), ...d.pabellones.filter(p => p.camara).map(p => p.camara.logo)];
  await Promise.all([...srcs.map(loadImg), Promise.race([document.fonts ? document.fonts.ready : 0, new Promise(r => setTimeout(r, 1500))])]);
  renderRibbon();
  G.init();
  addEventListener('hashchange', route);
  route();
}).catch(err => {
  $('#loading').textContent = 'No se pudo cargar el catálogo. Recarga la página para intentarlo de nuevo.';
});
})();
</script>
